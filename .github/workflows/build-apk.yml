name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if git fetch origin apk-signing 2>/dev/null && git show origin/apk-signing:debug.keystore > "$HOME/.android/debug.keystore" 2>/dev/null; then
            echo "Using the existing Bird Play debug signing key."
          else
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p /tmp/bird-play-signing
            cp "$HOME/.android/debug.keystore" /tmp/bird-play-signing/debug.keystore
            git checkout --orphan apk-signing
            git rm -rf . || true
            cp /tmp/bird-play-signing/debug.keystore ./debug.keystore
            git add debug.keystore
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Persist Bird Play debug signing key"
            git push --force origin apk-signing
            git checkout main
          fi
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish public APK download
        run: |
          mkdir -p /tmp/bird-play-release
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/bird-play-release/Bird-Play.apk
          git checkout --orphan apk-download
          git rm -rf . || true
          cp /tmp/bird-play-release/Bird-Play.apk ./Bird-Play.apk
          git add Bird-Play.apk
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish Bird Play APK"
          for attempt in 1 2 3 4 5; do
            if git push --force origin apk-download; then
              break
            fi
            echo "Publish race detected; retrying ($attempt/5)..."
            sleep 3
          done
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bird-Play-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
